name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Prepare optional Google OAuth client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_JSON_B64: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON_B64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON_B64)) {
            $bytes = [Convert]::FromBase64String($env:GOOGLE_OAUTH_CLIENT_JSON_B64)
            [IO.File]::WriteAllBytes((Join-Path $PWD "assets\google_oauth_client.json"), $bytes)
            "Bundled Google OAuth desktop client: yes" | Set-Content logs\google-oauth-build.txt
          } else {
            "Bundled Google OAuth desktop client: no (runtime JSON selection remains available)" | Set-Content logs\google-oauth-build.txt
          }

      - name: Show environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python --version 2>&1 | Tee-Object -FilePath logs\environment.txt
          pip --version 2>&1 | Tee-Object -FilePath logs\environment.txt -Append
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture |
            Format-List |
            Out-String |
            Tee-Object -FilePath logs\environment.txt -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          python -m pip install --upgrade pip wheel setuptools 2>&1 |
            Tee-Object -FilePath logs\pip-install.txt
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed: $LASTEXITCODE" }

          python -m pip install -r requirements-build.txt 2>&1 |
            Tee-Object -FilePath logs\pip-install.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed: $LASTEXITCODE" }

          python -m pip freeze 2>&1 |
            Tee-Object -FilePath logs\pip-freeze.txt
          if ($LASTEXITCODE -ne 0) { throw "pip freeze failed: $LASTEXITCODE" }

      - name: Install Tesseract OCR and Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install tesseract -y --no-progress 2>&1 |
            Tee-Object -FilePath logs\chocolatey.txt
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Tesseract Chocolatey install failed: $LASTEXITCODE"
          }

          choco install innosetup -y --no-progress 2>&1 |
            Tee-Object -FilePath logs\chocolatey.txt -Append
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Inno Setup Chocolatey install failed: $LASTEXITCODE"
          }

          $tesseract = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          if (-not (Test-Path $tesseract)) {
            throw "Tesseract installation was not found at $tesseract"
          }
          & $tesseract --version 2>&1 |
            Tee-Object -FilePath logs\tesseract-version.txt

          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          $languages = @(
            'eng','deu','fra','ita','por','spa','jpn','kor','chi_sim','chi_tra','osd'
          )
          foreach ($lang in $languages) {
            $target = Join-Path $tessdata "$lang.traineddata"
            if (-not (Test-Path $target)) {
              $url = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata"
              Write-Host "Downloading OCR language: $lang"
              Invoke-WebRequest -Uri $url -OutFile $target -UseBasicParsing
            }
          }

          Get-ChildItem $tessdata -Filter *.traineddata |
            Select-Object Name, Length |
            Format-Table -AutoSize |
            Out-String |
            Set-Content logs\tesseract-languages.txt

      - name: Build portable application
        shell: pwsh
        run: .\scripts\build_windows.ps1 -TesseractPath "C:\Program Files\Tesseract-OCR"

      - name: Build installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: .\scripts\build_installer.ps1

      - name: Collect build diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

          if (Test-Path build\JustInCard\warn-JustInCard.txt) {
            Copy-Item build\JustInCard\warn-JustInCard.txt logs\pyinstaller-warnings.txt -Force
          }
          if (Test-Path build\JustInCard\xref-JustInCard.html) {
            Copy-Item build\JustInCard\xref-JustInCard.html logs\pyinstaller-xref.html -Force
          }

          if (Test-Path release) {
            Get-ChildItem release -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize |
              Out-String -Width 240 |
              Set-Content logs\release-files.txt
          } else {
            "release directory was not created" |
              Set-Content logs\release-files.txt
          }

          git status --short 2>&1 |
            Tee-Object -FilePath logs\git-status.txt

      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JustInCard-Windows-${{ github.run_number }}
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JustInCard-Windows-Logs-${{ github.run_number }}
          path: logs/**
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.zip', '.exe', '.sha256' }
          if (-not $files) { throw "No release files found." }

          $args = @(
            'release', 'create', '${{ github.ref_name }}',
            '--title', 'Just InCard ${{ github.ref_name }}',
            '--generate-notes'
          )
          foreach ($file in $files) {
            $args += $file.FullName
          }
          & gh @args
